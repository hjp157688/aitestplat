# AITestPlat 全栈 Nginx 配置(仅根 docker compose 使用,经卷挂载覆盖默认 conf)
# 注意:frontend/nginx.conf 保留给"仅前端"模式,勿改本仓库该文件
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 上传请求体上限(OpenAPI/Swagger 文档、知识库文档等可能达数 MB;
    # nginx 默认仅 1m,超过即 413。跨 Django 之前的反代层先放开,multipart 由后端流式落盘)
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Vite 构建产物缓存(默认输出到 dist/assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django collectstatic 产物(共享卷 static_data 挂载到 /srv/static;^~ 避免命中代理)
    location ^~ /static/       { alias /srv/static/; }
    location ^~ /static_files/ { alias /srv/static/; }

    # API 反代到 backend(daphne,HTTP)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式(AI SSE / chat_stream)必须关缓冲+长超时,否则整个响应被 nginx 攒到最后才推给浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Media 直读共享卷(prod 下 Django 不供 /media/,nginx 必须直读;dev 同在)
    location /media/ {
        alias /srv/media/;
    }

    # WebSocket(APP 自动化实时进度)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
