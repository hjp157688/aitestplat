version: '3.8'

services:
  # 前端应用
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitestplat_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - aitestplat_network

networks:
  aitestplat_network:
    driver: bridge
